        <!-- ================= POSTS SECTION ================= -->

        <!-- <input type="text" [value]="title()" (input)="title.set($event.target.value)" placeholder="Enter title"/>
    <input type="text" [value]="views()" (input)="views.set($event.target.value)" placeholder="Enter Views"/>
    <button (click)="addPost()">Add Post</button> -->
        <div class="card shadow-sm mb-4">
            <div class="card-header fw-bold">
                ➕ Add New Post
            </div>

            <div class="card-body">
                <div class="row g-3 align-items-center">

                    <div class="col-md-5">
                        <input type="text" class="form-control" placeholder="Enter post title" [value]="title()"
                            (input)="title.set($event.target.value)" />
                    </div>

                    <div class="col-md-3">
                        <input type="number" class="form-control" placeholder="Views" [value]="views()"
                            (input)="views.set($event.target.value)" />
                    </div>

                    <div class="col-md-4">

                        @if(!isEdit()){
                        <button class="btn btn-primary w-100" (click)=" addPost()">
                            ➕ Add Post
                        </button>
                        }@else {
                        <button class="btn btn-primary w-100" (click)=" addPost()">
                             Update Post
                        </button>
                        }


                    </div>

                </div>
            </div>
        </div>


        <div class="card-header d-flex justify-content-between align-items-center border-top">
            <h4 class="mb-0 fw-bold">📝 Post List</h4>
        </div>

        <ul class="list-group list-group-flush">
            @for (post of posts(); track post.id) {
            <li class="list-group-item">
                <div class="row align-items-center">

                    <div class="col-md-1 fw-semibold text-muted">
                        #{{ post.id }}
                    </div>

                    <div class="col-md-5 fw-semibold">
                        {{ post?.title }}
                    </div>

                    <div class="col-md-2 text-muted">
                        👁 {{ post.views }}
                    </div>

                    <div class="col-md-4 text-end">
                        <button class="btn btn-sm btn-outline-primary me-2" (click)="editPost(post)">
                            ✏️ Edit
                        </button>

                        <button class="btn btn-sm btn-outline-danger" (click)="deletePost(post)">
                            🗑 Delete
                        </button>
                    </div>

                </div>
            </li>
            }
        </ul>

    </div>
</div>
